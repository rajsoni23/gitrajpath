<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Pathology Lab Software</title>
  <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
  <div class="app-header no-print">    
    <span>🔬 PATHOLOGY LAB SOFTWARE</span>    
    <span>Status: 🟢 Local Storage Active</span>  
  </div>

  <div class="nav-tabs no-print">    
    <button class="tab-btn active" onclick="switchTab('tab-register', event)">1. Registration & Testing</button>    
    <button class="tab-btn" onclick="switchTab('tab-doctors', event)">2. Doctor Referrals</button>    
    <button class="tab-btn" onclick="switchTab('tab-billing', event)">3. Billing & Summary</button>  
  </div>

  <!-- Dynamic Content Container -->
  <main id="tab-content-container">
    <!-- Component views will load here dynamically -->
  </main>

  <!-- PRINTABLE TEMPLATE (Always keep in main shell) -->
  <div id="printable-bill" style="display: none; color: black; background: white; padding: 30px;">    
    <h2 style="text-align: center; margin: 0;">EXPRESS PATHOLOGY LABORATORY</h2>    
    <p style="text-align: center; font-size: 12px; margin: 4px 0;">Mirzapur, Uttar Pradesh | Helpline: 9876543210</p>    
    <hr style="border: 1px solid #000;">    
    <table style="width: 100%; font-size: 13px; margin-bottom: 10px;">      
      <tr>        
        <td><b>Bill ID:</b> <span id="print-bill-id"></span></td>        
        <td><b>Date:</b> <span id="print-date"></span></td>      
      </tr>      
      <tr>        
        <td><b>Patient Name:</b> <span id="print-p-name"></span></td>        
        <td><b>Age/Gender:</b> <span id="print-p-age-gender"></span></td>      
      </tr>      
      <tr>        
        <td colspan="2"><b>Referred By:</b> <span id="print-doc-name"></span></td>      
      </tr>    
    </table>    
    <hr style="border: 0.5px solid #ccc;">    
    <h3>Test Results Summary</h3>    
    <div id="print-tests-container" style="font-size: 12px; line-height: 1.5;"></div>    
    <hr style="border: 0.5px solid #ccc;">    
    <div style="float: right; width: 250px; font-size: 13px;">      
      <p>Subtotal: ₹<span id="print-sub"></span></p>      
      <p>Discount: -₹<span id="print-disc"></span></p>      
      <h3 style="margin: 5px 0;">Net Payable: ₹<span id="print-net"></span></h3>    
    </div>    
    <div style="clear: both;"></div>    
    <hr style="border: 1px solid #000; margin-top: 30px;">    
    <p style="text-align: center; font-size: 11px; margin-top: 20px;">Thank you for trusting us. Get well soon!</p>  
  </div>

  <script type="module" src="../patients/patient.js"></script>
</body>
</html>
