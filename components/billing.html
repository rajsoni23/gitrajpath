<div class="card">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
    <h3 style="margin:0; border:none;">Generated Bills & Patient List</h3>
    <input type="text" id="search-bill-input" placeholder="🔍 Search Patient Name or Bill ID..." onkeyup="filterBillsTable()" style="width: 280px;">
  </div>
  <table>
    <thead>
      <tr>
        <th>Bill ID</th>
        <th>Patient Name</th>
        <th>Doctor</th>
        <th>Tests</th>
        <th>Net Amount</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="billing-table-body">
      <tr><td colspan="6" style="text-align: center; color: #94a3b8;">No bills generated yet.</td></tr>
    </tbody>
  </table>
</div>

<div id="bill-view-card" class="card" style="display: none;">
  <h3>Test Summary & Bill Generator</h3>
  <div class="grid-2">
    <div>
      <p><b>Patient:</b> <span id="bill-patient-info"></span> (<span id="bill-age-gender"></span>)</p>
      <p><b>Referred By:</b> <span id="bill-doctor-info"></span></p>
      <p><b>Test Summary & Values:</b></p>
      <div id="bill-tests-summary-box" style="background: #0f172a; padding: 10px; border-radius: 4px; border: 1px solid #334155; font-size: 12px; max-height: 180px; overflow-y: auto;"></div>
    </div>
    <div>
      <label>Subtotal Amount (₹)</label>
      <input type="number" id="bill-subtotal" readonly>
      <label style="margin-top: 8px;">Flat Discount in Rupees (₹)</label>
      <input type="number" id="bill-discount" value="0" onkeyup="calculateFinalBill()" onchange="calculateFinalBill()">
      <label style="margin-top: 8px;">Net Payable Amount (₹)</label>
      <input type="number" id="bill-net" readonly style="font-weight: bold; color: #38bdf8;">
      <div style="margin-top: 15px;">
        <button class="btn" onclick="window.print()">🖨️ Print Final Bill / Report</button>
      </div>
    </div>
  </div>
</div>
